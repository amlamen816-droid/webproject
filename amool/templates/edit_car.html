{% extends 'main.html' %}
{% load static %}
{% block content %}
<main class="form-container">
    <h2>تعديل السيارة</h2>

    {% if messages %}
    {% for message in messages %}
    <p style="color:green;">{{ message }}</p>
    {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>اسم السيارة:</label>
        <input type="text" name="name" value="{{ car.name }}" required>

        <label>سنة الموديل:</label>
        <input type="number" name="model_year" value="{{ car.model_year }}" required>

        <label>السعر:</label>
        <input type="number" step="0.01" name="price" value="{{ car.price }}" required>

        <label>الوصف:</label>
        <textarea name="description">{{ car.description }}</textarea>

        <label>رفع الصورة (اختياري):</label>
        <input type="file" name="image">

        <button type="submit">حفظ التعديلات</button>
    </form>
</main>
{% endblock %}
